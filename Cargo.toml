[package]
name = "pkginbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Inbox for packages installed by hand, outside chezmoi"
license = "MIT"
repository = "https://github.com/swchck/pkginbox"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.release]
lto = true
strip = true
